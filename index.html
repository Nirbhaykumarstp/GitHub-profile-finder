<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Github Profile Finder</title>
    <link rel="stylesheet" href="src/output.css">
</head>

<body>
    <header class="bg-blue-400 px-4 py-4 w-full">
        <nav>
            <h1 class="text-3xl sm:text-4xl text-white m-2 font-sans">
                Github Finder
            </h1>
        </nav>
    </header>
    <main class="flex flex-col bg-black min-h-screen align-middle">

        <div class="w-full  flex justify-center flex-col align-middle py-3">

            <h1 class="text-4xl sm:text-3xl md:text-4xl text-white text-center">
                Search by GitHub username
            </h1>
            <div class="py-4">
                <form class="flex flex-col sm:flex-row gap-3 justify-center w-full" id="form">

                    <input type="text" placeholder="Enter the Username" required id="userNameInput"
                        class="text-base sm:text-xl border-2 border-white text-white bg-black px-3 py-3 rounded">

                    <button class="bg-blue-400 text-lg sm:text-xl text-white px-10 py-3 rounded-md" id="submit">
                        Search
                    </button>

                </form>

            </div>

        </div>

        <section id="user">
            <div id="user-details" class="text-white md:flex justify-center px-3 2xl:flex-row align-middle gap-7">
                <div>
                    <img alt="userprofile" id="user-image" height="300" width="300">
                </div>
                <div class="details" class="text-white">
                    <ul class="flex gap-10">
                        <li class="px-2 py-2 border-2 border-white rounded">Public Repositries <span
                                id="publicRepo"></span></li>
                        <li class="px-2 py-2 border-2 border-white rounded">Followers <span id="followers"></span></li>
                        <li class="px-2 py-2 border-2 border-white rounded">Following <span id="following"></span></li>
                    </ul>
                    <br>
                    <div class="flex flex-col gap-5">
                        <label for="Name">Name:
                            <span id="name"></span>
                        </label>
                        <label for="Website:">Website/Portfolio:
                            <span id="portfolio"></span>
                        </label>
                        <label for="location">Location:
                            <span id="location"></span>
                        </label>
                        <label for="acc-date">Account since:
                            <span id="date"></span>
                        </label>
                        <div>
                            <button class="bg-blue-400 text-xl px-2 py-2 rounded font-sans" id="profile">View
                                Profile</button>
                        </div>
                    </div>

                </div>
            </div>
            <div id="recent-repos" class="flex flex-col text-xl text-white  px-12 py-12">
                <div class="grid grid-cols-1 gap-4 lg:grid-cols-3 max-h-screen" id="repo-div">
