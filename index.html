<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Github Profile Finder</title>
    <link rel="stylesheet" href="src/output.css">
</head>

<body>
    <header class="bg-blue-400 px-4 py-4 w-full">
        <nav>
            <h1 class="text-3xl sm:text-4xl text-white m-2 font-sans">
                Github Finder
            </h1>
        </nav>
    </header>
    <main class="flex justify-center bg-black min-h-screen px-4">

        <div class="w-full max-w-2xl">

            <h1 class="text-4xl sm:text-3xl md:text-4xl text-white py-4 text-center">
                Search by GitHub username
            </h1>
            <div class="py-4">

                <form action="" method="" class="flex flex-col sm:flex-row gap-3 justify-center w-full">

                    <input type="text" placeholder="Enter the Username" required id="userNameInput"
                        class="text-base sm:text-xl border-2 border-white text-white bg-black px-3 py-3 rounded w-5xl sm:flex-1">

                    <button class="bg-blue-400 text-lg sm:text-xl text-white px-10 py-3 rounded-md w-5xl sm:w-auto"
                        id="submit">
                        Submit
                    </button>

                </form>

            </div>

        </div>

    </main>

    <script src="application.js"></script>

</body>

</html>
