<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Github Profile Finder</title>
    <link rel="stylesheet" href="src/output.css">
</head>

<body>
    <header class="bg-blue-400 px-4 py-4 w-full">
        <nav>
            <h1 class="text-3xl sm:text-4xl text-white m-2 font-sans">
                Github Finder
            </h1>
        </nav>
    </header>
    <main class="flex flex-col items-center bg-black min-h-screen w-full">

        <div class="w-full max-w-3xl flex flex-col items-center justify-center py-6 px-4">

            <h1 class="text-2xl sm:text-3xl md:text-4xl text-white text-center px-2">
                Search by GitHub username
            </h1>
            <div class="py-4 w-full">
                <form class="flex flex-col sm:flex-row gap-3 justify-center items-stretch sm:items-center w-full" id="form" id="form">

                    <input type="text" placeholder="Enter the Username" required id="userNameInput"
                        class="w-full sm:w-80 text-base sm:text-lg md:text-xl border-2 border-white text-white bg-black px-3 py-2 sm:py-3 rounded">

                    <button class="w-full sm:w-80 bg-blue-400 text-lg sm:text-xl text-white px-6 sm:px-10 py-3 rounded-md cursor-pointer hover:bg-blue-500 transition" id="submit" id="submit">
                        Search
                    </button>

                </form>

            </div>

        </div>

        <section id="user" class="w-full">
            <div id="user-details" class="text-white flex flex-col md:flex-row justify-center items-start md:items-start gap-3 md:gap-10 px-4 sm:px-6 lg:px-5 mb-10:items-start">
                <div class="lg:flex sm:justify-center">
                    <img alt="userprofile" id="user-image"  class="w-40 h-40 sm:w-56 sm:h-56 md:w-64 md:h-64 lg:w-72 lg:h-72 rounded-full object-cover mx-auto">
                </div>
                <div class="details text-white flex flex-col items-start md:items-start gap-4 w-full md:w-auto">
                    <ul class="flex flex-wrap justify-center md:justify-start gap-3 sm:gap-5 md:gap-8 text-sm sm:text-base">
                        <li class="px-3 py-2 sm:px-4 border-2 border-white rounded whitespace-nowrap">Public Repositries <span
                                id="publicRepo"></span></li>
                        <li class="px-3 py-2 sm:px-4 border-2 border-white rounded whitespace-nowrap">Followers <span id="followers"></span></li>
                        <li class="px-3 py-2 sm:px-4 border-2 border-white rounded whitespace-nowrap">Following <span id="following"></span></li>
                    </ul>
                    <div class="flex flex-col gap-3 items-start sm:gap-4  md:text-end sm:text-lg lg:flex-initial">
                        <label for="Name">Name:
                            <span id="name"></span>
                        </label>
                        <label for="Website:">Website/Portfolio:
                            <span id="portfolio"></span>
                        </label>
                        <label for="location">Location:
                            <span id="location"></span>
                        </label>
                        <label for="acc-date">Account since:
                            <span id="date"></span>
                        </label>
                        <div>
                            <button class="w-auto sm:w-auto bg-blue-400 text-lg sm:text-xltext-white px-4 py-4 rounded font-sans cursor-pointer hover:bg-blue-500 transition mt-1" id="profile" id="profile">View
                                Profile</button>
                        </div>
                    </div>

                </div>
            </div>
            <div id="recent-repos" class="flex flex-col text-white text-base sm:text-lg lg:text-xl px-4 sm:px-8 lg:px-12 py-8 lg:py-12 w-full">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-5 lg:gap-6 w-full py-10" id="repo-div"></div>
            </div>
        </section>

    </main>
    <footer class="bg-blue-400 flex flex-wrap w-full px-4 py-4 justify-center items-center text-base sm:text-xl gap-2 sm:gap-3">
        <nav class="text-shadow-black font-bold">
            Developed By |
        </nav>
        <nav class="text-shadow-black font-bold">
            Nirbhay
        </nav>
    </footer>
    <script src="application.js"></script>

</body>

</html>
